[project]
name = "edge-cloud-llm"
version = "0.1.0"
description = "Adaptive confidence-driven edge-cloud LLM inference framework (thesis prototype)"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "pandas",
    "edge_sim_py @ git+https://github.com/EdgeSimPy/EdgeSimPy.git",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
